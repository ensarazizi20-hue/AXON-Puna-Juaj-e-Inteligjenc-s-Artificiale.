html{scroll-behavior:smooth}

header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) clamp(16px,4vw,48px) 14px;background:linear-gradient(var(--bg),transparent)}

main{position:relative;z-index:5}

.w{max-width:620px}.wide{max-width:1100px}

.q.o button::after{transform:rotate(45deg)}
.a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s ease}
.q.o .a{grid-template-rows:1fr}.a div{overflow:hidden}.a p{padding-bottom:20px}
form{display:grid;gap:12px;max-width:520px}
input,textarea{background:rgba(5,12,24,.7);border:1px solid var(--ln);border-radius:10px;padding:14px;color:var(--tx);font:400 15px var(--d);width:100%}
input:focus,textarea:focus{outline:0;border-color:var(--cy);box-shadow:0 0 0 3px rgba(0,240,255,.15)}
.ci{font:400 14px var(--m);margin:6px 0 24px;display:grid;gap:6px}.ci span{color:var(--cy);display:inline-block;width:64px}

footer{position:relative;z-index:5;padding:30px;text-align:center;font:400 11px var(--m);color:var(--mu)}
:focus-visible{outline:2px solid var(--cy);outline-offset:3px}

fH:"Clear answers before you automate.",faq:[["Does AXON work in Albanian?","Yes. Agents work in Albanian, English and Macedonian, and switch languages within the same conversation."],["How long does deployment take?","It depends on the number of platforms, but process mapping and a pilot start within the first weeks. You get a clear timeline after the consultation."],["Can it integrate with the systems we already use?","Yes. We connect to your existing platforms without asking you to change tools."],["What happens when the agent meets something it doesn't know?","It doesn't guess. It hands the conversation to a team member with the full context."]],
cH:"Build your AI workforce.",cS:"Tell us where your team loses time. AXON maps the workflow, connects the platforms and deploys agents that work nonstop.",
f:["Name","Company","Email","Phone","Your message..."],send:"Send Signal →",ok:"Signal prepared. Confirm sending in your email app."}};

/* ---------- RENDER ---------- */
let L='sq',vSel=0;try{L=localStorage.getItem('axl')||'sq'}catch(e){}
const $=s=>document.querySelector(s);
function render(){
const t=T[L];document.documentElement.lang=L;$('#cta').textContent=t.cta;
document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L));
const tasks=c=>`<div class="tasks ${c}">${t.tk.map(x=>`<div class="t"><span>${x}</span><div><i></i></div></div>`).join('')}</div>`;
$('#app').innerHTML=`
<section id="hero" data-k="0"><div class="w"><span class="tag">${t.badge}</span><h1>${t.h1}</h1><p>${t.d}</p>
<div class="row"><a class="btn" href="#lidhu">${t.c1}</a><a class="btn g" href="#paketat">${t.c2}</a></div>
<div class="met"><div><b>24/7</b><span>${t.m[0]}</span></div><div><b>3</b><span>${t.m[1]}</span></div><div><b>&lt;5s</b><span>${t.m[2]}</span></div></div></div></section>
<section data-k="1"><div class="wide"><h2>${t.s2[0]}</h2><div class="grid" style="max-width:860px">
<div class="card bot"><h3>${t.s2[1]}</h3><p>${t.s2[2]}</p>${tasks('')}</div>
<div class="card pop"><h3>${t.s2[3]}</h3><p>${t.s2[4]}</p>${tasks('')}</div></div></div></section>
<section data-k="2"><div class="wide"><h2>${t.capH}</h2><div class="grid">${t.caps.map((c,i)=>`<div class="card" data-n="${i}" tabindex="0"><span class="tag">${c[0]}</span><h3>${c[1]}</h3><p>${c[2]}</p></div>`).join('')}</div></div></section>
<section data-k="3"><div class="wide"><h2>${t.vH}</h2><div class="vs">${t.vs.map((v,i)=>`<button data-v="${i}" aria-pressed="${i===vSel}">${v}</button>`).join('')}</div></div></section>
<section data-k="4"><div class="wide"><h2>${t.pH}</h2><p style="margin:-14px 0 28px">${t.pS}</p><div class="grid">${t.pr.map((s,i)=>`<div class="card"><span class="tag">0${i+1}</span><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('')}</div></div></section>
<section id="paketat" data-k="5"><div class="wide"><h2>${t.tH}</h2><div class="grid">${t.tiers.map((x,i)=>`<div class="card ${i==1?'pop':''}">${i==1?`<em>${t.pop}</em>`:''}<h3>${x[0]}</h3><p>${x[1]}</p><ul>${x[2].map(f=>`<li>${f}</li>`).join('')}</ul><a class="btn g" href="#lidhu">${t.tc}</a></div>`).join('')}</div></div></section>
<section data-k="6"><div class="wide"><h2>${t.secH}</h2><div class="grid">${t.sec.map((s,i)=>`<div class="card"><span class="tag">0${i+1}</span><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('')}</div></div></section>
<section data-k="7"><div class="wide"><h2>${t.fH}</h2>${t.faq.map(q=>`<div class="q"><button aria-expanded="false">${q[0]}</button><div class="a"><div><p>${q[1]}</p></div></div></div>`).join('')}</div></section>
<section id="lidhu" data-k="8"><div class="wide"><span class="tag">LIDHU</span><h2>${t.cH}</h2><p style="margin:-14px 0 20px">${t.cS}</p>
<div class="ci"><div><span>TEL</span><a href="tel:+38979354994">+389 79 354 994</a></div><div><span>EMAIL</span><a href="mailto:axonautomation.io@gmail.com">axonautomation.io@gmail.com</a></div><div><span>WEB</span><a href="https://www.axonautomation.io">www.axonautomation.io</a></div></div>
<form id="f"><input name="n" placeholder="${t.f[0]}" required autocomplete="name"><input name="c" placeholder="${t.f[1]}" autocomplete="organization"><input name="e" type="email" placeholder="${t.f[2]}" required autocomplete="email"><input name="p" type="tel" placeholder="${t.f[3]}" autocomplete="tel"><textarea name="m" rows="4" placeholder="${t.f[4]}" required></textarea>
<button class="btn" type="submit">${t.send}</button><div id="ok" role="status"></div></form></div></section>`;
bind();measure();
}
function bind(){
document.querySelectorAll('.q button').forEach(b=>b.onclick=()=>{const q=b.parentNode,o=q.classList.toggle('o');b.setAttribute('aria-expanded',o)});
document.querySelectorAll('.vs button').forEach(b=>b.onclick=()=>{vSel=+b.dataset.v;document.querySelectorAll('.vs button').forEach(x=>x.setAttribute('aria-pressed',x===b));pulse=1});
document.querySelectorAll('[data-n]').forEach(c=>{const on=()=>focusN=+c.dataset.n,off=()=>focusN=-1;c.onmouseenter=on;c.onfocus=on;c.onmouseleave=off;c.onblur=off});
$('#f').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);$('#ok').textContent=T[L].ok;
const body=`${d.get('n')} / ${d.get('c')} / ${d.get('p')}\n\n${d.get('m')}`;
location.href=`mailto:axonautomation.io@gmail.com?subject=${encodeURIComponent('AXON — '+d.get('e'))}&body=${encodeURIComponent(body)}`;e.target.reset()};
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem('axl',L)}catch(e){}render()});

/* ---------- LOGO AS STANDALONE SVG (texture + favicon) ---------- */
const MKURL=(()=>{const g=document.querySelector('#mark').innerHTML;
return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="512" height="512"><defs>'+document.querySelector('#ag').outerHTML+'</defs>'+g+'</svg>')})();
{const l=document.createElement('link');l.rel='icon';l.href=MKURL;document.head.appendChild(l)}
/* ---------- 3D NEURAL CORE ---------- */
let focusN=-1,pulse=0,tops=[],secs=[];
function measure(){secs=[...document.querySelectorAll('section')];tops=secs.map(s=>[s.offsetTop,s.offsetHeight])}
addEventListener('resize',measure);
render();
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
(function(){
let R;const cv=$('#gl');
try{if(!window.THREE)throw 0;R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});}catch(e){document.body.classList.add('nogl');return}
R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(45,1,.1,100);
const col=new THREE.Color(0x00F0FF),U={uT:{value:0},uC:{value:col}};
const G=new THREE.Group();S.add(G);
const fres=new THREE.ShaderMaterial({uniforms:U,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,
vertexShader:`varying vec3 n;varying vec3 v;varying vec3 p;void main(){n=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.);v=normalize(-mv.xyz);p=position;gl_Position=projectionMatrix*mv;}`,
fragmentShader:`uniform vec3 uC;uniform float uT;varying vec3 n;varying vec3 v;varying vec3 p;void main(){float f=pow(1.-abs(dot(n,v)),2.4);float s=.5+.5*sin(p.y*14.-uT*2.);gl_FragColor=vec4(uC*(f*1.4+s*.05),f*.9+.03);}`});
G.add(new THREE.Mesh(new THREE.IcosahedronGeometry(1.7,4),fres));
const wire=new THREE.Mesh(new THREE.IcosahedronGeometry(1.95,2),new THREE.MeshBasicMaterial({color:col,wireframe:true,transparent:true,opacity:.09}));G.add(wire);
const core=new THREE.Mesh(new THREE.SphereGeometry(.55,32,32),new THREE.MeshBasicMaterial({color:0x04141F}));G.add(core);
const halo=new THREE.Mesh(new THREE.SphereGeometry(.9,32,32),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.18,blending:THREE.AdditiveBlending,depthWrite:false}));G.add(halo);
const lg=new THREE.Sprite(new THREE.SpriteMaterial({transparent:true,depthTest:false,opacity:.95}));lg.scale.set(1.7,1.7,1);lg.renderOrder=9;G.add(lg);
{const im=new Image();im.onload=()=>{const t=new THREE.Texture(im);t.needsUpdate=true;lg.material.map=t;lg.material.needsUpdate=true};im.src=MKURL}
const rings=[0,1,2].map(i=>{const r=new THREE.Mesh(new THREE.TorusGeometry(2.4+i*.45,.011,8,160),new THREE.MeshBasicMaterial({color:i==1?0x7B61FF:col,transparent:true,opacity:.7,blending:THREE.AdditiveBlending}));r.rotation.set(1.1+i*.5,i*.7,i);G.add(r);return r});
const nodes=[0,1,2,3].map(i=>{const m=new THREE.Mesh(new THREE.SphereGeometry(.09,16,16),new THREE.MeshBasicMaterial({color:0x4F7CFF}));const a=i*Math.PI/2+.6;m.userData.p=new THREE.Vector3(Math.cos(a)*2.2,(i%2?.9:-.9),Math.sin(a)*2.2);m.position.copy(m.userData.p);G.add(m);return m});
const N=1600,pos=new Float32Array(N*3),at=new Float32Array(N*4);
for(let i=0;i<N;i++){at.set([2+Math.random()*2.6,Math.random()*6.28,(Math.random()-.5)*2.6,.15+Math.random()*.5],i*4)}
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));pg.setAttribute('a',new THREE.BufferAttribute(at,4));
const pm=new THREE.ShaderMaterial({uniforms:{...U,uS:{value:1}},transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,
vertexShader:`attribute vec4 a;uniform float uT;uniform float uS;varying float al;void main(){float an=a.y+uT*a.w*.6;float r=a.x*uS;vec3 q=vec3(cos(an)*r,a.z+sin(uT+a.y*3.)*.1,sin(an)*r);vec4 mv=modelViewMatrix*vec4(q,1.);al=.5+.5*sin(a.y*9.+uT);gl_PointSize=(2.2+al*1.6)*(7./-mv.z)*${(Math.min(devicePixelRatio,2)).toFixed(1)};gl_Position=projectionMatrix*mv;}`,
fragmentShader:`uniform vec3 uC;varying float al;void main(){float d=length(gl_PointCoord-.5);if(d>.5)discard;gl_FragColor=vec4(uC,(1.-d*2.)*(.35+al*.6));}`});
G.add(new THREE.Points(pg,pm));
const COL=[0x00F0FF,0x4F7CFF,0x7B61FF,0x00F0FF,0x00B8FF];
/* keyframes per section: x, y, z, color idx, ring spread, particle spread */
const K=[[1.9,0,7,0,1,1],[-2.1,.2,8,1,1.2,1.1],[1.9,0,6.4,0,.9,.9],[-1.9,0,7.4,2,1.4,1.3],[1.9,-.1,6.8,1,1,1],[-2.1,0,8.6,4,1.6,1.5],[1.9,0,6.2,2,.8,.8],[-1.9,0,7.6,1,1.1,1.1],[0,.3,9,0,1.8,1.6]];
const cur=[1.9,0,7,0,1,1],tc=new THREE.Color(),vc=[0x00F0FF,0x4F7CFF,0x7B61FF,0x00D0A0,0x00B8FF];
let mx=0,my=0,dx=0,dy=0,drag=false,lx=0,ly=0,rx=0,ry=0,t0=performance.now();
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;if(drag){dx+=(e.clientX-lx)*.006;dy+=(e.clientY-ly)*.006;lx=e.clientX;ly=e.clientY}});
const hero=$('#hero')||document.body;
document.addEventListener('pointerdown',e=>{if(e.target.closest('#hero')&&!e.target.closest('a,button')){drag=true;lx=e.clientX;ly=e.clientY}});
addEventListener('pointerup',()=>drag=false);
function size(){R.setSize(innerWidth,innerHeight,false);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}
addEventListener('resize',size);size();
const sm=x=>x*x*(3-2*x);
function frame(now){
requestAnimationFrame(frame);if(document.hidden)return;
const t=(now-t0)/1000,sp=RM?0:1;U.uT.value=t*sp;
/* section progress */
const mid=scrollY+innerHeight*.5;let i=0;for(let k=0;k<tops.length;k++)if(tops[k][0]<=mid)i=k;
const f=tops[i]?Math.min(1,Math.max(0,(mid-tops[i][0])/tops[i][1])):0;
const a=K[Math.min(i,8)],b=K[Math.min(i+1,8)],w=sm(Math.min(1,Math.max(0,(f-.55)/.45)));
const mob=innerWidth<800;
const tg=[0,1,2,4,5].map(j=>a[j]+(b[j]-a[j])*w);
const e=.06;cur[0]+=(tg[0]-cur[0])*e;cur[1]+=(tg[1]-cur[1])*e;cur[2]+=(tg[2]-cur[2])*e;cur[4]+=(tg[3]-cur[4])*e;cur[5]+=(tg[4]-cur[5])*e;
const ci=vSel&&i===3?vc[vSel]:COL[(w>.5?b[3]:a[3])];tc.setHex(ci);col.lerp(tc,.05);
G.position.x=mob?0:cur[0];G.position.y=mob?1.6-Math.min(i,1)*.2:cur[1];
C.position.set(mx*-.6,my*.4,mob?cur[2]+3.5:cur[2]);C.lookAt(0,0,0);
rx+=(dx-rx)*.08;ry+=(dy-ry)*.08;
G.rotation.y=t*.12*sp+rx+mx*.3;G.rotation.x=ry+my*.2;
wire.rotation.y=-t*.05*sp;
pulse*=.95;const pu=1+Math.sin(t*2.2*sp)*.06+pulse*.3;core.scale.setScalar(pu);lg.scale.setScalar(1.7*(1+(pu-1)*.5));halo.scale.setScalar(pu*1.1);
rings.forEach((r,j)=>{r.rotation.z+=.002*(j+1)*sp;r.scale.setScalar(cur[4]*(1+j*.02))});
pm.uniforms.uS.value=cur[5];
nodes.forEach((n,j)=>{const s=focusN===j?2.6:1;n.scale.x+=(s-n.scale.x)*.12;n.scale.setScalar(n.scale.x);n.material.color.setHex(focusN===j?0x00F0FF:0x4F7CFF)});
R.render(S,C)}
requestAnimationFrame(frame);
})();
</script>
